ength="197.668" font-family="Arial">Prepare all matching operations</text><rect x="227.861" y="374.313" width="287.716" height="35.641" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="237.861" y="396.986" fill="#243746" font-size="14" textLength="267.716" font-family="Arial">Step 3: search and review pages of 50 files</text><rect x="227.482" y="429.953" width="288.475" height="35.641" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="237.482" y="452.627" fill="#243746" font-size="14" textLength="268.475" font-family="Arial">Include all or save page-specific exclusions</text><rect x="241.868" y="485.594" width="259.702" height="35.641" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="251.868" y="508.268" fill="#243746" font-size="14" textLength="239.702" font-family="Arial">Update review digest and log selection</text><polygon points="212.965,541.234,530.474,541.234,542.474,553.234,530.474,565.234,212.965,565.234,200.965,553.234,212.965,541.234" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="212.965" y="558.088" fill="#243746" font-size="14" textLength="317.509" font-family="Arial">Included blockers or unresolved placement issues?</text><text x="179.179" y="550.268" fill="#243746" font-size="14" textLength="21.786" font-family="Arial">yes</text><text x="542.474" y="550.268" fill="#243746" font-size="14" textLength="15.572" font-family="Arial">no</text><rect x="16" y="575.234" width="349.93" height="35.641" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="26" y="597.908" fill="#243746" font-size="14" textLength="329.93" font-family="Arial">Exclude conflicting files or create a corrected preview</text><ellipse cx="190.965" cy="641.875" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="190.965" cy="641.875" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-w